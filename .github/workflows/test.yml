# 每次推到 master、每個 PR 都跑測試（Windows 與 macOS）。雲端主機沒有顯示卡：疊圖、後製、AI 降噪都走 CPU。
# 三個專案用打過標籤的公開版本：標籤從 packaging/constraints.txt 的 apu-…== 讀，換版本只改那裡。

name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:     # bump-component.yml 開了 PR 之後用它啟動（GITHUB_TOKEN 開的 PR 不會自動觸發）

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: apu-astro-studio
      - name: 組件版本（從 packaging/constraints.txt 讀）
        id: ver
        shell: bash
        run: |
          C=apu-astro-studio/packaging/constraints.txt
          for n in pick photons processing; do
            echo "$n=v$(grep -E "^apu-$n==" $C | cut -d= -f3 | tr -d '\r ')" >> "$GITHUB_OUTPUT"
          done
          cat "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ApuHuang/apu-pick
          ref: ${{ steps.ver.outputs.pick }}
          path: astro-light-selector
      - uses: actions/checkout@v4
        with:
          repository: ApuHuang/apu-photons
          ref: ${{ steps.ver.outputs.photons }}
          path: ApuPhotonsUtility
      - uses: actions/checkout@v4
        with:
          repository: ApuHuang/apu-processing
          ref: ${{ steps.ver.outputs.processing }}
          path: apu-processing
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝
        shell: bash
        run: |
          python -m pip install --upgrade pip
          C=apu-astro-studio/packaging/constraints.txt
          python -m pip install -c $C PySide6 pyqtgraph pytest onnxruntime lz4 zstandard
          python -m pip install -c $C -e ./astro-light-selector -e ./ApuPhotonsUtility -e ./apu-processing
          python -m pip install -c $C -e ./apu-astro-studio --no-deps
      - name: 測試
        working-directory: apu-astro-studio
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
